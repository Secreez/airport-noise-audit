project:
  type: manuscript
  output-dir: _manuscript
  execute-dir: project

manuscript:
  article: report.qmd
  code-links: repo

execute:
  echo: false
  warning: false
  message: false

bibliography: refs.bib
csl: apa.csl

format:
  html:
    toc: true
    toc-depth: 3
    theme: cosmo
    notebook-links: false
  pdf:
    toc: false
    number-sections: true