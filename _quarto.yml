project:
  type: manuscript
  output-dir: _manuscript

execute-dir: project
execute:
  cache: true
  freeze: auto
  echo: false
  warning: false
  message: false

format:
  html:
    notebook-links: false
    toc: true
    toc-depth: 3
    theme: cosmo
    comments:
      hypothesis: true

bibliography: refs.bib

manuscript:
  article: report.qmd
  notebooks:
    - notebook: report.qmd
      title: Article Notebook
